defaults:
  - model: transformer
  - _self_

seed: 0
device: auto   

batch_size: 64
num_epochs: 30
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 3e-4

validation_every_steps: 250
patience: 8
checkpoint_path: checkpoints/transformer.pt
samples_path: results/sequences/transformer.csv
num_samples: 500
temperature: 1.0

hydra:
  job:
    chdir: false  
